# XinHere 全栈编排（生产·本机）：挂外部 ai_network（pg_db / model-api / xuanpu 容器名直达）
# ----------------------------------------------------------------------------
# 发布设计（改码/改配置均不重建镜像）：
#   - 后端镜像只含 Python 依赖；源码/插件/契约/alembic 卷挂载进容器 → 改代码重启即生效
#   - 前端镜像为纯 nginx；dist 产物 + nginx.conf 卷挂载 → 改前端代码重新 build dist 后重启
#   - 环境变量经 env_file 注入（.docker.env 共享基础设施 + .env 生产覆盖层）→ 改配置 up -d 即生效
#   - 仅依赖(requirements.txt / package.json)变化时才需要 docker compose build（见 deploy/publish.sh）
# 一次性发布入口：bash deploy/publish.sh（含前端构建、依赖检测、alembic 迁移、启动）
# ----------------------------------------------------------------------------
services:
  xinhere-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: xinhere-backend:latest
    container_name: xinhere-backend
    env_file:
      - .docker.env
      - .env
    volumes:
      # 源码/迁移/插件/契约：与镜像内 /app 布局一致（勿删，缺挂载即缺文件）
      - ./apps/backend/app:/app/apps/backend/app
      - ./apps/backend/alembic:/app/apps/backend/alembic
      - ./apps/backend/alembic.ini:/app/apps/backend/alembic.ini
      - ./plugins:/app/plugins
      - ./packages/contracts:/app/packages/contracts
      - ./apps/backend/data:/app/apps/backend/data
      # 文件夹式技能（SKILL.md + 脚本；运行期写入 .research_state/ 与 reports/，需可写）
      - ./apps/backend/skills:/app/apps/backend/skills
    # 不发布宿主端口（参照 xuanpu 模式 ports: []）：backend 仅在 ai_network 内互通，
    # 由 frontend nginx 的 /api/ 反代 (backend:8196)；调试走 https://宿主:8096/api/...
    healthcheck:
      # 容器内应用监听 8196
      test: ["CMD", "curl", "-f", "http://localhost:8196/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: no
    networks:
      - ai_network

  xinhere-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: xinhere-frontend:latest
    container_name: xinhere-frontend
    env_file:
      # VITE_* 前端运行时配置（nginx entrypoint 渲染为 config.js）
      - .env
    volumes:
      # 宿主构建产物 + nginx 配置（改前端代码/反代配置无需重建镜像）
      - ./apps/frontend/dist:/usr/share/nginx/html
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
    # 不发布宿主端口：宿主 8096 已由外部 nginx 容器 (tool/nginx) 持有并对外提供 https 入口
    # (listen 8096 ssl)；外部 nginx 经 ai_network 静态 IP 直连本容器（见 networks 段）
    depends_on:
      xinhere-backend:
        condition: service_healthy
    restart: no
    networks:
      ai_network:
        # 静态 IP：外部 nginx (xuanpu.conf xinhere :8096/:8099) 反代目标，重启不变
        ipv4_address: 172.28.200.20

networks:
  ai_network:
    external: true
